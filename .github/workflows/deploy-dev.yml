name: Deploy to S3 (dev)

# dev 브랜치에 커밋/머지(push)가 들어올 때마다 배포합니다.
on:
  push:
    branches:
      - dev

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-northeast-2
  S3_BUCKET: mystocks-dev
  S3_PREFIX: private/monitoring

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_DATA_BASE_URL: ${{ vars.VITE_DATA_BASE_URL }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEV_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Sync to S3
        run: |
          aws s3 sync dist/ "s3://${S3_BUCKET}/${S3_PREFIX}/" --delete

      - name: Invalidate CloudFront cache
        if: ${{ vars.DEV_CLOUDFRONT_DISTRIBUTION_ID != '' }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.DEV_CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
